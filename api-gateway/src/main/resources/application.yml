server:
  port: 4004
  netty:
    access-log:
      enabled: true
#Docker config
spring:
  cloud:
    gateway:
      routes:
        - id: patient-service-route
          uri: http://patient-service:4000
          predicates:
            - Path=/api/patients/**

        - id: api-docs-patient-route
          uri: http://patient-service:4000
          predicates:
            - Path=/api-docs/patients
          filters:
            - RewritePath=/api-docs/patients,/v3/api-docs

        - id: api-docs-favicon
          uri: http://patient-service:4000
          predicates:
            - Path=/favicon.ico


